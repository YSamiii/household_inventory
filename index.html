<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <title>Home Stock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-copy">
        <div class="eyebrow" id="headerEyebrow">家庭库存</div>
        <h1>Home Stock</h1>
      </div>
      <button class="icon-button" id="quickCheckBtn" type="button" aria-label="Quick Check">✓</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-view="home" class="nav-button active"><span class="nav-icon">⌂</span><span data-i18n="navHome">首页</span></button>
      <button data-view="inventory" class="nav-button"><span class="nav-icon">▦</span><span data-i18n="navInventory">库存</span></button>
      <button data-view="add" class="nav-button nav-add"><span class="nav-plus">＋</span><span data-i18n="navAdd">新增</span></button>
      <button data-view="buy" class="nav-button"><span class="nav-icon">⌕</span><span data-i18n="navBuy">想买</span></button>
      <button data-view="settings" class="nav-button"><span class="nav-icon">⚙</span><span data-i18n="navSettings">设置</span></button>
    </nav>
  </div>

  <dialog id="appModal">
    <section class="modal-panel">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </section>
  </dialog>

  <input id="screenshotInput" type="file" accept="image/*" hidden>
  <input id="backupInput" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
